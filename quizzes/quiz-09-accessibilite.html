<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 09 — Accessibilite Vue.js</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 09 — Accessibilite Vue.js</h1>
    <p class="subtitle">WCAG, attributs ARIA, gestion du focus, navigation clavier, vue-axe, routing accessible</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1 — WCAG et attributs ARIA dans les templates Vue",
        text: "Quel probleme d'accessibilite presente ce template Vue, et comment le corriger ?",
        code: "&lt;template&gt;\n  &lt;div @click=\"toggleMenu\" class=\"menu-button\"&gt;\n    Menu\n  &lt;/div&gt;\n  &lt;div v-show=\"isOpen\" class=\"dropdown\"&gt;\n    &lt;div @click=\"navigate('home')\"&gt;Accueil&lt;/div&gt;\n    &lt;div @click=\"navigate('about')\"&gt;A propos&lt;/div&gt;\n  &lt;/div&gt;\n&lt;/template&gt;",
        options: [
          "Aucun probleme, les div avec @click sont suffisants pour l'accessibilite",
          "Il faut utiliser des elements semantiques (button, nav, a) ou ajouter role=\"button\", tabindex=\"0\", aria-expanded, aria-haspopup, et gerer les evenements clavier (@keydown.enter, @keydown.space)",
          "Il suffit d'ajouter un attribut title sur chaque div",
          "Les lecteurs d'ecran lisent automatiquement les @click sur les div"
        ],
        answer: 1,
        explanation: "Les div ne sont pas interactifs par defaut : ils ne recoivent pas le focus clavier et les lecteurs d'ecran ne les annoncent pas comme des boutons. Selon WCAG 2.1 (critere 4.1.2 Name, Role, Value), il faut soit utiliser &lt;button&gt; et &lt;a&gt;, soit ajouter role, tabindex=\"0\", aria-expanded, aria-haspopup et gerer @keydown.enter / @keydown.space. En Vue, les attributs ARIA sont des bindings dynamiques : :aria-expanded=\"isOpen\"."
      },
      {
        label: "Question 2 — Gestion du focus avec useTemplateRef",
        text: "Que fait ce composable et pourquoi est-il important pour l'accessibilite ?",
        code: "&lt;script setup lang=\"ts\"&gt;\nimport { useTemplateRef, nextTick } from 'vue';\n\nconst dialogRef = useTemplateRef('dialog');\nconst triggerRef = useTemplateRef('trigger');\nconst isOpen = ref(false);\n\nasync function openDialog() {\n  isOpen.value = true;\n  await nextTick();\n  dialogRef.value?.focus();\n}\n\nfunction closeDialog() {\n  isOpen.value = false;\n  triggerRef.value?.focus();\n}\n&lt;/script&gt;\n\n&lt;template&gt;\n  &lt;button ref=\"trigger\" @click=\"openDialog\"&gt;Ouvrir&lt;/button&gt;\n  &lt;dialog ref=\"dialog\" v-if=\"isOpen\" role=\"dialog\"\n    aria-modal=\"true\" tabindex=\"-1\" @keydown.esc=\"closeDialog\"&gt;\n    &lt;!-- contenu --&gt;\n  &lt;/dialog&gt;\n&lt;/template&gt;",
        options: [
          "useTemplateRef sert uniquement a animer le dialogue, sans rapport avec l'accessibilite",
          "Il gere le focus management : a l'ouverture, le focus est deplace dans le dialogue (apres nextTick pour que le DOM soit a jour), et a la fermeture, le focus retourne au bouton declencheur — essentiel pour les utilisateurs clavier et lecteurs d'ecran",
          "Il empeche l'utilisateur de fermer le dialogue avec Echap",
          "nextTick n'est pas necessaire, on peut appeler focus() immediatement"
        ],
        answer: 1,
        explanation: "WCAG 2.4.3 (Focus Order) exige que le focus soit gere de maniere logique. Quand un dialogue s'ouvre, le focus doit y entrer ; quand il se ferme, le focus doit retourner a l'element declencheur. useTemplateRef (Vue 3.5+) fournit une reference typee au DOM. nextTick est crucial car Vue met a jour le DOM de maniere asynchrone : sans attendre, l'element n'existe pas encore dans le DOM et focus() echouerait."
      },
      {
        label: "Question 3 — Navigation clavier dans un composant Vue",
        text: "Ce composant implemente la navigation clavier dans un menu de type listbox. Quel pattern d'accessibilite suit-il ?",
        code: "&lt;script setup lang=\"ts\"&gt;\nconst items = ['Option A', 'Option B', 'Option C'];\nconst activeIndex = ref(0);\n\nfunction onKeydown(e: KeyboardEvent) {\n  switch (e.key) {\n    case 'ArrowDown':\n      e.preventDefault();\n      activeIndex.value = (activeIndex.value + 1) % items.length;\n      break;\n    case 'ArrowUp':\n      e.preventDefault();\n      activeIndex.value = (activeIndex.value - 1 + items.length) % items.length;\n      break;\n    case 'Home':\n      activeIndex.value = 0;\n      break;\n    case 'End':\n      activeIndex.value = items.length - 1;\n      break;\n    case 'Enter':\n    case ' ':\n      e.preventDefault();\n      selectItem(activeIndex.value);\n      break;\n  }\n}\n&lt;/script&gt;\n\n&lt;template&gt;\n  &lt;ul role=\"listbox\" @keydown=\"onKeydown\" tabindex=\"0\"\n    :aria-activedescendant=\"'item-' + activeIndex\"&gt;\n    &lt;li v-for=\"(item, i) in items\" :key=\"i\"\n      :id=\"'item-' + i\" role=\"option\"\n      :aria-selected=\"i === activeIndex\"&gt;\n      {{ item }}\n    &lt;/li&gt;\n  &lt;/ul&gt;\n&lt;/template&gt;",
        options: [
          "C'est le pattern Roving Focus qui deplace tabindex entre les enfants",
          "C'est le pattern aria-activedescendant : un seul element parent est focusable (tabindex=\"0\") et aria-activedescendant indique quel enfant est visuellement actif, avec navigation Fleches, Home, End, Enter/Space",
          "Ce code n'est pas accessible car les li n'ont pas de tabindex",
          "Les touches Home et End ne sont pas recommandees par les WAI-ARIA Authoring Practices"
        ],
        answer: 1,
        explanation: "Le pattern aria-activedescendant (WAI-ARIA Authoring Practices) place un seul tabindex=\"0\" sur le conteneur. L'attribut aria-activedescendant pointe vers l'id de l'option active, et les lecteurs d'ecran annoncent cette option. Avantage par rapport au roving focus : un seul element dans l'ordre de tabulation, pas besoin de deplacer tabindex entre les enfants. Les touches Home/End sont recommandees par les WAI-ARIA Practices pour les listbox."
      },
      {
        label: "Question 4 — vue-axe en developpement",
        text: "A quoi sert vue-axe et comment l'integrer dans un projet Vue 3 ?",
        code: "// main.ts\nimport { createApp } from 'vue';\nimport App from './App.vue';\n\nconst app = createApp(App);\n\nif (import.meta.env.DEV) {\n  import('vue-axe').then(({ default: VueAxe }) =&gt; {\n    app.use(VueAxe, {\n      auto: true,       // audit automatique apres chaque rendu\n      delay: 1000,      // delai avant audit (ms)\n      config: {\n        rules: [\n          { id: 'color-contrast', enabled: true },\n          { id: 'region', enabled: false },\n        ],\n      },\n    });\n    app.mount('#app');\n  });\n} else {\n  app.mount('#app');\n}",
        options: [
          "vue-axe est un framework de tests e2e specifique a Vue",
          "vue-axe integre axe-core directement dans le navigateur pendant le developpement : il audite automatiquement le DOM apres chaque rendu et affiche les violations a11y dans la console, avec un import dynamique pour ne pas l'inclure en production",
          "vue-axe ne fonctionne qu'avec Vue 2 et n'est pas compatible avec Vue 3",
          "vue-axe remplace les DevTools du navigateur pour l'inspection du DOM"
        ],
        answer: 1,
        explanation: "vue-axe est un plugin de developpement qui integre axe-core dans l'application Vue. En mode auto, il audite le DOM apres chaque mise a jour de composant et affiche les violations WCAG directement dans la console du navigateur. L'import dynamique conditionnel (import.meta.env.DEV) garantit que le bundle de production n'inclut pas les ~300KB d'axe-core. On peut configurer les regles a activer/desactiver selon le projet."
      },
      {
        label: "Question 5 — Routing accessible avec Vue Router",
        text: "Quels problemes d'accessibilite pose la navigation SPA avec Vue Router, et comment les resoudre ?",
        code: "&lt;script setup lang=\"ts\"&gt;\nimport { useRouter } from 'vue-router';\nimport { useTemplateRef, nextTick, watch } from 'vue';\n\nconst router = useRouter();\nconst mainContent = useTemplateRef('main');\n\nrouter.afterEach((to) =&gt; {\n  // 1. Mettre a jour le titre de la page\n  document.title = to.meta.title as string || 'Mon App';\n\n  // 2. Annoncer le changement de page aux lecteurs d'ecran\n  const announcer = document.getElementById('route-announcer');\n  if (announcer) {\n    announcer.textContent = `Page chargee : ${to.meta.title}`;\n  }\n\n  // 3. Deplacer le focus en haut du contenu\n  nextTick(() =&gt; {\n    mainContent.value?.focus();\n  });\n});\n&lt;/script&gt;\n\n&lt;template&gt;\n  &lt;div id=\"route-announcer\" aria-live=\"assertive\"\n    class=\"sr-only\" role=\"status\"&gt;&lt;/div&gt;\n  &lt;main ref=\"main\" tabindex=\"-1\"&gt;\n    &lt;RouterView /&gt;\n  &lt;/main&gt;\n&lt;/template&gt;",
        options: [
          "Vue Router gere automatiquement l'accessibilite, aucune configuration supplementaire n'est necessaire",
          "Il suffit d'ajouter aria-current=\"page\" sur les liens actifs dans la navigation",
          "Les SPA ne rechargent pas la page lors de la navigation : il faut manuellement (1) mettre a jour document.title, (2) annoncer le changement via une region aria-live pour les lecteurs d'ecran, (3) deplacer le focus vers le contenu principal pour les utilisateurs clavier",
          "La seule solution est d'utiliser le mode SSR pour que chaque page soit un rechargement complet"
        ],
        answer: 2,
        explanation: "Contrairement a la navigation classique, une SPA ne declenche pas de rechargement de page. Les lecteurs d'ecran ne sont donc pas informes du changement de contenu. Les trois techniques sont complementaires : document.title met a jour l'onglet et les lecteurs d'ecran, aria-live=\"assertive\" annonce immediatement le changement, et le deplacement du focus (via tabindex=\"-1\" sur main) permet aux utilisateurs clavier de reprendre la navigation depuis le debut du nouveau contenu. Vue Router fournit afterEach() comme hook ideal pour cela."
      }
    ];
    let currentQuestion = 0, score = 0, answered = false;
    function renderQuestion() {
      const q = questions[currentQuestion];
      const total = questions.length;
      document.getElementById('progressBar').style.width = ((currentQuestion / total) * 100) + '%';
      document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} / ${total}`;
      let html = `<div class="card"><p class="question-label">${q.label}</p><p class="question-text">${q.text}</p>`;
      if (q.code) html += `<pre><code>${q.code}</code></pre>`;
      html += `<ul class="options">`;
      q.options.forEach((opt, i) => { html += `<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`; });
      html += `</ul><button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button><div class="feedback" id="feedback"></div></div>`;
      document.getElementById('quizContainer').innerHTML = html;
      document.querySelectorAll('input[name="q"]').forEach(r => { r.addEventListener('change', () => { document.getElementById('validateBtn').disabled = false; }); });
      answered = false;
    }
    function validate() {
      if (answered) { currentQuestion++; if (currentQuestion < questions.length) renderQuestion(); else showScore(); return; }
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      const btn = document.getElementById('validateBtn');
      document.querySelectorAll('input[name="q"]').forEach(r => r.disabled = true);
      if (val === q.answer) { score++; fb.className = 'feedback correct'; fb.innerHTML = `<strong>Correct !</strong> ${q.explanation}`; }
      else { fb.className = 'feedback wrong'; fb.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`; }
      btn.textContent = currentQuestion < questions.length - 1 ? 'Suivant' : 'Voir le score';
    }
    function showScore() {
      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = 'Termine !';
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct === 100 ? 'Parfait !' : pct >= 60 ? 'Bien joue !' : 'Continuez a reviser !';
      sc.innerHTML = `<div class="score">${score} / ${questions.length}</div><div class="score-label">${msg} (${pct}%)</div><button class="btn-restart" onclick="restart()">Recommencer</button>`;
    }
    function restart() { currentQuestion = 0; score = 0; answered = false; document.getElementById('scoreContainer').classList.add('hidden'); document.getElementById('quizContainer').classList.remove('hidden'); renderQuestion(); }
    renderQuestion();
  </script>
</body>
</html>
